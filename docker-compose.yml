services:
  postgres:
    image: postgres:16
    container_name: itbis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itbis_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: itbis_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: itbis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
