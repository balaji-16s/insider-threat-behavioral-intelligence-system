services:
  postgres:
    image: postgres:16
    container_name: itbis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itbis_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: itbis_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itbis_user -d itbis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: itbis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: itbis_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=itbis_user
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=itbis_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://itbis_user:changeme@postgres:5432/itbis_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=production-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: itbis_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
