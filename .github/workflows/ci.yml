name: ITBIS CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest Suite & Code Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itbis_user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: itbis_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        env:
          TEST_DATABASE_URL: postgresql://itbis_user:changeme@localhost:5433/itbis_test
          JWT_SECRET_KEY: ci-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest --tb=short
